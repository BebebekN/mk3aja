<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mohamad Irgi</title>

    <!-- Menghubungkan HTML dengan CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <!-- Logo + Judul -->
            <div class="login-title">
                <img src="ChatGPT Image Aug 17, 2026, 09_25_58 PM.png" alt="Logo Mohamad Irgi">
                <h1>Log In</h1>
            </div>

            <p class="subtitle">
                Silakan masuk ke akun Anda
            </p>

            <!-- Form Login -->
            <form>

                <!-- Username -->
                <div class="input-group">
                    <label for="username">Username</label>

                    <input 
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Masukkan username"
                        required
                    >
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="password">Password</label>

                    <input 
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password"
                        required
                    >
                </div>

                <!-- Lupa Password -->
                <div class="forgot">
                    <a href="#">Lupa password?</a>
                </div>

                <!-- Tombol Login -->
                <button type="submit">
                    Log In
                </button>

            </form>

            <!-- Register -->
            <p class="register">
                Belum punya akun?
                <a href="#">Daftar sekarang</a>
            </p>

        </div>

    </div>

</body>
</html>
